<!DOCTYPE html>
<html>
<head>
  <base href="/sonaris-pulse-demo/">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sonaris Pulse — Energy Waste Intelligence">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="48x48" href="favicon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <title>Sonaris Pulse</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: #0A0F14; }
    flutter-view, flt-glass-pane, flt-scene, flt-scene-host {
      width: 100% !important; height: 100% !important; display: block !important;
    }
  </style>
</head>
<body>
  <p id="boot-status" style="display:none;margin:0;padding:24px;font-family:system-ui,sans-serif;color:#e2e8f0">
    Loading Sonaris Pulse…
  </p>
  <script>
    // Clear stale service workers so GitHub Pages updates are visible immediately.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        regs.forEach(function (r) { r.unregister(); });
      });
    }
    (function () {
      var status = document.getElementById('boot-status');
      var shown = setTimeout(function () { status.style.display = 'block'; }, 600);
      var script = document.createElement('script');
      script.src = 'flutter_bootstrap.js';
      script.async = true;
      script.onload = function () {
        clearTimeout(shown);
        status.style.display = 'none';
      };
      script.onerror = function () {
        clearTimeout(shown);
        status.style.display = 'block';
        status.textContent =
          'The app did not load. This address is not serving flutter_bootstrap.js. ' +
          'Open a release build of build/web, not a flutter run -d chrome debug port.';
      };
      document.body.appendChild(script);
    })();
  </script>
</body>
</html>

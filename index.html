<!DOCTYPE html>
<html>
<head>
  <base href="/sonaris-pulse-demo/">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sonaris Pulse — Energy Waste Intelligence">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="48x48" href="favicon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <title>Sonaris Pulse</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: #0A0F14; }
    flutter-view, flt-glass-pane, flt-scene, flt-scene-host {
      width: 100% !important; height: 100% !important; display: block !important;
    }
  </style>
</head>
<body>
  <script>
    // Drop stale service workers/caches, then boot Flutter.
    // An old SW can 404 flutter_bootstrap.js if we do not wait.
    (async function () {
      var stale = false;
      try {
        if ('serviceWorker' in navigator) {
          var regs = await navigator.serviceWorker.getRegistrations();
          if (regs.length) {
            stale = true;
            await Promise.all(regs.map(function (r) { return r.unregister(); }));
          }
        }
        if (window.caches) {
          var keys = await caches.keys();
          if (keys.length) {
            stale = true;
            await Promise.all(keys.map(function (k) { return caches.delete(k); }));
          }
        }
      } catch (_) {}
      if (stale) {
        location.reload();
        return;
      }
      var script = document.createElement('script');
      script.src = new URL('flutter_bootstrap.js', document.baseURI).href;
      script.async = true;
      document.body.appendChild(script);
    })();
  </script>
</body>
</html>
